- name: Install Android Tools
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils e2fsprogs python3 wget curl
          
          mkdir -p bin
          
          echo "Downloading lpmake, lpunpack, and lpdump..."
          # Download dynamic partition tools archive directly
          curl -sSL "https://github.com/phuss/lpmake-lpunpack/releases/download/v1.0/lpmake-lpunpack-linux-x86_64.tar.gz" | tar -xz -C bin/
          
          # Fallback check to ensure all 3 tools exist
          if [ ! -f bin/lpmake ] || [ ! -f bin/lpunpack ] || [ ! -f bin/lpdump ]; then
            echo "Fallback download for dynamic partition binaries..."
            curl -sSL -o bin/lpmake "https://raw.githubusercontent.com/unix-tools/android-tools-binaries/main/bin/lpmake" || true
            curl -sSL -o bin/lpunpack "https://raw.githubusercontent.com/unix-tools/android-tools-binaries/main/bin/lpunpack" || true
            curl -sSL -o bin/lpdump "https://raw.githubusercontent.com/unix-tools/android-tools-binaries/main/bin/lpdump" || true
          fi

          chmod +x bin/*
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH
